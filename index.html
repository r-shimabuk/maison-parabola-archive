<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>メゾンパラボラ 大喜利・企画アーカイブ</title>
<style>
:root{
  --paper:#F7F5EF; --ink:#141414; --sub:#6b6a66; --line:#e3e0d7; --card:#fff;
  --blue:#0086F1; --red:#FF3400; --green:#009944; --yellow:#FDD000;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--paper);color:var(--ink);
  font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",system-ui,sans-serif;
  line-height:1.8;-webkit-font-smoothing:antialiased}
.wrap{max-width:780px;margin:0 auto;padding:0 20px}
header.hero{background:var(--ink);color:#fff;padding:26px 0 18px;position:relative;overflow:hidden}
.hero .stripe{position:absolute;inset:0 0 auto 0;height:5px;display:flex}
.hero .stripe i{flex:1}
.hero .wrap{position:relative}
.omi-top{position:absolute;right:20px;top:0;font:inherit;font-size:12.5px;font-weight:600;background:var(--yellow);color:var(--ink);border:0;border-radius:999px;padding:5px 14px;cursor:pointer}
.omi-top.on{background:#fff}
.hero h1{font-size:clamp(30px,7vw,52px);line-height:1.3;margin:0 0 8px;font-weight:700;letter-spacing:0}
.hero h1 span{display:block;font-size:13px;font-weight:500;letter-spacing:.12em;color:var(--yellow);margin-bottom:0}
.stats{display:flex;gap:28px;flex-wrap:wrap;margin-top:8px}
.stats div{font-size:11px;color:#bdbbb4;letter-spacing:.06em}
.stats b{display:block;font-size:20px;color:#fff;font-weight:600;letter-spacing:0;line-height:1.2;font-variant-numeric:tabular-nums}
nav.tabs{position:sticky;top:0;z-index:20;background:rgba(247,245,239,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
nav.tabs .wrap{display:flex;gap:6px;align-items:center;padding-top:10px;padding-bottom:10px;flex-wrap:wrap}
.tab{border:0;background:transparent;font:inherit;font-weight:600;font-size:15px;padding:6px 14px;border-radius:999px;cursor:pointer;color:var(--sub)}
.tab.on{background:var(--ink);color:#fff}
.search{flex:1;min-width:160px;margin-left:auto;position:relative}
.search input{width:100%;font:inherit;font-size:16px;padding:7px 12px;border:1.5px solid var(--line);border-radius:999px;background:#fff;outline:none}
.search input:focus{border-color:var(--ink)}
.filters{padding:14px 0 4px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.filters .lbl{font-size:12px;color:var(--sub);margin-right:4px;flex:none;white-space:nowrap}
.chip{font:inherit;font-size:12.5px;font-weight:500;border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:3px 11px;cursor:pointer;color:var(--ink)}
.chip.on{border-color:currentColor;background:currentColor}
.chip.on span{color:#fff}
.years{display:flex;flex-wrap:wrap;gap:4px;padding:8px 0 18px}
.years a{font-size:12px;font-weight:500;color:var(--sub);text-decoration:none;padding:2px 9px;border-radius:6px;background:#ebe8df;font-variant-numeric:tabular-nums}
.years a:hover{background:var(--ink);color:#fff}
.yearhead{display:flex;align-items:baseline;gap:12px;margin:44px 0 14px;scroll-margin-top:60px}
.yearhead h2{font-size:32px;font-weight:600;margin:0;line-height:1;letter-spacing:0;font-variant-numeric:tabular-nums}
.yearhead small{color:var(--sub);font-size:12px}
.ans li{font-weight:400}
.topic{background:var(--card);border-radius:14px;margin:0 0 16px;padding:20px 22px 14px;box-shadow:0 1px 0 var(--line)}
.topic .meta{font-size:11.5px;color:var(--sub);display:flex;gap:10px;align-items:center;font-variant-numeric:tabular-nums;letter-spacing:.03em}
.topic .meta .n{margin-left:auto}
.topic h3{margin:6px 0 12px;font-size:15px;line-height:1.7;font-weight:700;white-space:pre-line;border-left:5px solid var(--blue);padding-left:12px}
.topic:nth-of-type(4n+2) h3{border-color:var(--red)}
.topic:nth-of-type(4n+3) h3{border-color:var(--green)}
.topic:nth-of-type(4n+4) h3{border-color:var(--yellow)}
.ans{list-style:none;margin:0;padding:0}
.ans li{display:grid;grid-template-columns:5.6em 1fr 2.3em;gap:10px;padding:9px 0;border-top:1px dashed var(--line);font-size:19px;line-height:1.65}
.ans li:first-child{border-top:0}
.who{font-size:12px;font-weight:600;padding-top:7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.txt{white-space:pre-line;word-break:break-word}
.more{font:inherit;font-size:12.5px;font-weight:500;color:var(--sub);background:none;border:0;padding:8px 0 2px;cursor:pointer}
.more:hover{color:var(--ink)}
mark{background:var(--yellow);color:inherit;padding:0 1px;border-radius:2px}
.kk{background:var(--card);border-radius:12px;padding:14px 18px;margin:0 0 10px;box-shadow:0 1px 0 var(--line)}
.kk h3{margin:0 0 2px;font-size:16.5px;font-weight:700;line-height:1.5}
.kk p{margin:2px 0 0;font-size:14px;color:#33322f;white-space:pre-line}
.kk .meta{font-size:11.5px;color:var(--sub);margin-top:6px;display:flex;gap:10px;flex-wrap:wrap;font-variant-numeric:tabular-nums}
.tag{font-size:11px;font-weight:600;color:var(--ink);background:var(--yellow);border-radius:4px;padding:0 6px}
.ctrl{display:flex;flex-wrap:wrap;gap:8px 18px;padding:14px 0 0}
.seg{display:flex;align-items:center;gap:4px}
.seg .lbl{font-size:12px;color:var(--sub);margin-right:4px;white-space:nowrap}
.seg button{font:inherit;font-size:12.5px;border:1.5px solid var(--line);background:#fff;border-radius:8px;padding:3px 10px;cursor:pointer;color:var(--ink)}
.seg button.on{background:var(--ink);border-color:var(--ink);color:#fff}
.st{display:inline-block;margin-left:8px;font-size:11px;font-weight:600;color:#7a5a00;background:#FFF1A8;border-radius:999px;padding:0 7px;line-height:1.7;vertical-align:1px;white-space:nowrap}
.ans li.top{background:#FFF8D1;margin:0 -10px;padding-left:10px;padding-right:10px;border-radius:8px;border-top-color:transparent}
.ans li.top + li{border-top-color:transparent}
.toplbl{display:block;font-size:10.5px;font-weight:600;color:#7a5a00;margin-top:2px}
.menu{font:inherit;font-size:13px;font-weight:600;border:1.5px solid var(--ink);background:#fff;color:var(--ink);border-radius:999px;padding:5px 12px;cursor:pointer;white-space:nowrap}
.menu.on{background:var(--ink);color:#fff}
.menu .dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--red);margin-left:5px;vertical-align:2px}
.panel{border-top:1px solid var(--line);max-height:70vh;overflow:auto}
.panel .years{padding-bottom:12px}
.totop{position:fixed;right:16px;bottom:calc(18px + env(safe-area-inset-bottom));z-index:30;width:46px;height:46px;border-radius:50%;border:0;background:var(--ink);color:#fff;font-size:20px;line-height:1;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.18);opacity:0;pointer-events:none;transform:translateY(8px);transition:opacity .2s,transform .2s}
.totop.show{opacity:1;pointer-events:auto;transform:none}
.rk{background:var(--card);border-radius:12px;padding:14px 18px 12px;margin:0 0 10px;box-shadow:0 1px 0 var(--line);display:grid;grid-template-columns:2.6em 1fr;gap:4px 12px}
.rk .no{font-size:22px;font-weight:600;line-height:1.2;font-variant-numeric:tabular-nums;color:var(--sub)}
.rk.g1 .no{color:#B98F00}.rk.g2 .no{color:#8a8f96}.rk.g3 .no{color:#b0704a}
.rk .a{font-size:16px;font-weight:600;white-space:pre-line;word-break:break-word;line-height:1.6}
.rk .odai{grid-column:2;font-size:12.5px;color:var(--sub);line-height:1.6}
.rk .odai b{font-weight:600;color:#3d3c38}
.rk .m{grid-column:2;font-size:11.5px;color:var(--sub);display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-variant-numeric:tabular-nums}
.rno{font-size:13px;font-weight:600;color:var(--ink)}
.rno.g1{color:#B98F00}.rno.g2{color:#7d838b}.rno.g3{color:#b0704a}
.st.lkn{color:#b3261e;background:#FFE1DA}.st[hidden]{display:none}
.st.neg{color:#2f5d8a;background:#DCEBFA}
.rankseg{margin:24px 0 0}
.rankseg button{font-size:13px;padding:5px 12px}
.mem .mh{display:flex;align-items:baseline;gap:10px}
.mrank{font-size:13px;color:var(--sub);font-variant-numeric:tabular-nums;width:1.4em}
.mname{font-size:20px;font-weight:700}
.mcount{margin-left:auto;font-size:26px;font-weight:600;font-variant-numeric:tabular-nums}
.mcount small{font-size:12px;color:var(--sub);margin-left:3px;font-weight:400}
.bar{height:6px;background:#efece4;border-radius:3px;margin:8px 0 10px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:3px}
.mstats{display:flex;flex-wrap:wrap;align-items:center;gap:4px 12px;font-size:11.5px;color:#55534d;font-variant-numeric:tabular-nums}
.ylbl{font-size:11px;color:var(--sub);margin-top:10px}
.myears{display:flex;gap:4px;margin:4px 0 2px;flex-wrap:wrap}
.myears span{font-size:10.5px;color:var(--sub);background:#f3f1ea;border-radius:6px;padding:2px 7px;text-align:center;min-width:3.2em;line-height:1.4}
.myears b{display:block;font-size:13px;color:var(--ink);font-weight:600}
.mbest{margin-top:16px;background:var(--paper);border-radius:12px;padding:14px 16px 12px;cursor:pointer}
.mbest .lbl{display:flex;align-items:center;justify-content:space-between;font-size:11.5px;font-weight:600;color:var(--sub)}.mbest .pt{color:#fff;font-size:11.5px;font-weight:700;border-radius:999px;padding:1px 9px}
.mbest .q{font-size:14px;font-weight:700;line-height:1.6;margin-top:10px;border-left:4px solid;padding-left:10px}
.mbest .a{font-size:18px;line-height:1.6;margin-top:10px;white-space:pre-line}.mbest .bm{font-size:11px;color:var(--sub);margin-top:6px;text-align:right}
.reshuf{font:inherit;font-size:12px;border:1px solid var(--line);background:#fff;border-radius:6px;padding:1px 8px;cursor:pointer;color:var(--ink)}
.kseg{margin:24px 0 10px}
.omi{text-align:center;padding:16px 0 10px}
.omi-lbl{font-size:17px;font-weight:700}
.omi-sub{font-size:11.5px;color:var(--sub);margin:2px 0 12px;line-height:1.6}
.omi-card{text-align:left;position:relative}
.omi-f{font-size:34px;font-weight:700;line-height:1;margin:2px 0 12px;letter-spacing:.06em}
.omi-btn{font:inherit;font-size:14px;font-weight:600;background:var(--ink);color:#fff;border:0;border-radius:999px;padding:9px 28px;cursor:pointer;margin:0 0 14px;min-width:11em}
#omiCard{min-height:60vh}
.omi-btn:active{transform:scale(.97)}
.home{padding:22px 0 10px}
.h-lead{font-size:12px;color:var(--sub);letter-spacing:.08em;font-variant-numeric:tabular-nums;margin-bottom:10px}
.h-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-bottom:10px}
.h-main{grid-template-columns:repeat(2,1fr)}
.hs{background:var(--card);border-radius:12px;padding:14px 16px 12px;box-shadow:0 1px 0 var(--line)}
.hs b{display:block;font-size:30px;font-weight:600;line-height:1.15;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.h-main .hs b{font-size:44px}
.hs span{font-size:11.5px;color:var(--sub)}
.home h4{font-size:13px;font-weight:600;margin:30px 0 10px;color:var(--ink)}
.h-bars{background:var(--card);border-radius:12px;padding:12px 16px;box-shadow:0 1px 0 var(--line)}
.hb{display:grid;grid-template-columns:6.5em 1fr 4em;gap:4px 10px;align-items:center;padding:5px 0;font-variant-numeric:tabular-nums}
.hb .y{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar2{height:10px;background:#efece4;border-radius:5px;overflow:hidden}
.bar2 i{display:block;height:100%;background:var(--ink);border-radius:5px;transition:width .9s cubic-bezier(.2,.8,.2,1)}
.hb .v{font-size:14px;font-weight:600;text-align:right}
.hb .sub{grid-column:2/4;font-size:10.5px;color:var(--sub);margin-top:-4px}
.h-week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;background:var(--card);border-radius:12px;padding:14px 12px 10px;box-shadow:0 1px 0 var(--line);text-align:center}
.h-week .col{display:flex;align-items:flex-end;height:90px;background:#f3f1ea;border-radius:6px;overflow:hidden}
.h-week .col i{display:block;width:100%;background:var(--blue);transition:height .9s cubic-bezier(.2,.8,.2,1)}
.h-week b{display:block;font-size:11px;font-weight:600;margin-top:4px;font-variant-numeric:tabular-nums}
.h-week div>span:last-child{font-size:11px;color:var(--sub)}
.h-rec{display:grid;gap:10px}
.h-rec>div{background:var(--card);border-radius:12px;padding:12px 16px;box-shadow:0 1px 0 var(--line)}
.h-rec span{display:block;font-size:11px;color:var(--sub)}
.h-rec b{display:block;font-size:17px;font-weight:600;margin:2px 0;white-space:pre-line;word-break:break-word}
.h-rec em{font-style:normal;font-size:11.5px;color:var(--sub)}
.h-go{display:flex;gap:10px;justify-content:center;margin:30px 0 0}
.h-go button{font:inherit;font-size:14px;font-weight:600;border-radius:999px;padding:9px 22px;cursor:pointer;border:1.5px solid var(--ink);background:#fff;color:var(--ink)}
.h-go button:first-child{background:var(--ink);color:#fff}
@media (max-width:520px){.h-main .hs b{font-size:34px}.hs b{font-size:24px}.h-grid{grid-template-columns:repeat(2,1fr)}}
.lkc{display:flex;align-items:center;justify-content:flex-end}
.lk{font:inherit;background:none;border:0;padding:6px 2px 6px 8px;margin:0;font-size:27px;line-height:1;color:#b7b3a8;cursor:pointer;-webkit-tap-highlight-color:transparent}
.lk.on{color:#e0453a}
header.hero{transition:padding .5s cubic-bezier(.2,.8,.2,1)}
.hero h1 span,.stats b,.stats div{transition:font-size .5s cubic-bezier(.2,.8,.2,1)}
header.hero.big{padding:64px 0 46px}
.hero.big h1 span{font-size:15px}
.hero.big .stats{gap:30px}
.hero.big .stats b{font-size:48px;line-height:1.1}
.hero.big .stats div{font-size:13px}
.olist{background:var(--card);border-radius:12px;box-shadow:0 1px 0 var(--line);padding:4px 0}
.oi{display:grid;grid-template-columns:3.4em 1fr auto;gap:10px;align-items:baseline;padding:9px 16px;border-top:1px dashed var(--line);text-decoration:none;color:var(--ink)}
.oi:first-child{border-top:0}
.oi:active,.oi:hover{background:#faf8f2}
.od{font-size:11.5px;color:var(--sub);font-variant-numeric:tabular-nums}
.oq{font-size:14.5px;font-weight:600;line-height:1.55;white-space:pre-line;word-break:break-word}
.oc{font-size:11.5px;color:var(--sub);font-variant-numeric:tabular-nums}
.oc::after{content:'答'}
.topic{scroll-margin-top:110px;transition:box-shadow .3s}
.topic.flash{box-shadow:0 0 0 3px var(--yellow)}
.tabrow{display:flex;gap:4px;width:100%;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.tabrow::-webkit-scrollbar{display:none}
.tabrow .tab{flex:none}
.tabrow{justify-content:space-between}
h3.jump{cursor:pointer}
h3.jump .go{display:block;font-size:11px;font-weight:500;color:var(--sub);margin-top:2px}
h3.jump:hover .go{color:var(--ink)}
.rankhead{font-size:13px;color:var(--sub);margin:12px 0 14px}
.empty{color:var(--sub);text-align:center;padding:60px 0}
.intro{font-size:13px;color:var(--sub);margin:14px 0 0}
footer{color:var(--sub);font-size:12px;text-align:center;padding:60px 0 80px}
@media (max-width:520px){
  .wrap{padding:0 14px}
  .topic{padding:16px 16px 10px}
  .topic h3{font-size:14.5px}
  .ans li{font-size:18px}
  .ans li{grid-template-columns:1fr 2.4em;gap:0}
  .ans li .who{grid-column:1;grid-row:1}
  .ans li .txt{grid-column:1;grid-row:2}
  .ans li .lkc{grid-column:2;grid-row:1/3}
  .who{padding-top:0}
  .yearhead h2{font-size:28px}
  .hero{padding:20px 0 12px}
  .stats{gap:18px}
  .stats b{font-size:16px}
  nav.tabs .wrap{padding-top:7px;padding-bottom:7px;gap:4px}
  .tab{font-size:11.5px;padding:4px 5px;letter-spacing:-.03em}
  .tabrow{gap:0}
  .search input{font-size:16px;padding:4px 12px}
  .menu{font-size:12px;padding:4px 10px}
  .ctrl{gap:6px 12px;padding-top:10px}
  .seg .lbl,.filters .lbl{font-size:10.5px}
  .seg button{font-size:11px;padding:2px 7px;border-width:1px;border-radius:6px}
  .filters,.years{flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;padding-bottom:6px}
  .filters::-webkit-scrollbar,.years::-webkit-scrollbar{display:none}
  .filters{padding-top:10px}
  .chip{font-size:11px;padding:1px 8px;border-width:1px;flex:none}
  .years a{font-size:11px;padding:1px 7px;flex:none}
  .years{padding-bottom:10px}
}
@media (max-width:520px){.omi-top{right:14px}header.hero.big{padding:40px 0 28px}.hero.big .stats{display:grid;grid-template-columns:1fr 1fr;gap:14px 16px}.hero.big .stats b{font-size:30px}}
.lknote{font-size:12px;line-height:1.7;color:var(--sub);margin:18px 0 0;display:flex;gap:6px}.lknote .h{color:#FF3400;flex:none}
.hhead{margin:26px 0 16px}.hhead h2{font-size:18px;margin:0 0 4px;font-weight:700}.hhead p{font-size:12px;color:var(--sub);margin:0}
.hempty{font-size:14px;color:var(--sub);padding:30px 0}.hgo{font:inherit;font-size:14px;border:0;background:none;color:var(--ink);text-decoration:underline;cursor:pointer;padding:0;margin-left:6px}
.hero h1{cursor:pointer}
.ans li .txt{cursor:pointer}
.shot{position:fixed;inset:0;z-index:100;background:var(--paper);overflow:auto;display:flex;align-items:center;justify-content:center;padding:24px 16px}
.shot[hidden]{display:none}
.shot-in{width:100%;max-width:560px}
.shot-card{margin:0}
.shot-card h3{cursor:default;font-size:18px}.shot-card .ans li{font-size:22px}
.shot-mark{text-align:center;font-size:11px;letter-spacing:.14em;color:var(--sub);margin:16px 0 0;font-weight:600}
.shot-act{display:flex;justify-content:center;gap:10px;margin-top:22px}
.shot-act button{font:inherit;font-size:13px;border:1.5px solid var(--line);background:#fff;color:var(--ink);border-radius:999px;padding:6px 16px;cursor:pointer}
.shot-img{display:block;width:100%;border-radius:12px;box-shadow:0 2px 14px rgba(0,0,0,.08)}.shot-hint{text-align:center;font-size:12px;color:var(--sub);margin:12px 0 0}.shot-act .shot-cp{background:var(--yellow);border-color:var(--yellow);font-weight:600}.shot-act a{font:inherit;font-size:13px;border:1.5px solid var(--line);background:#fff;color:var(--ink);border-radius:999px;padding:6px 16px;text-decoration:none}
.shot-act .shot-x{background:var(--ink);border-color:var(--ink);color:#fff}
.timg{margin:10px 0 4px}.timg img{display:block;width:100%;max-height:420px;object-fit:contain;background:#fff;border-radius:8px;border:1px solid var(--line)}
.aimg{display:block;margin:4px 0 2px}.aimg img{display:block;max-width:100%;max-height:340px;border-radius:8px;border:1px solid var(--line);background:#fff}
.lkc{display:flex;flex-direction:column;align-items:center;gap:6px}
.mn{font:inherit;font-size:22px;line-height:1;width:1.7em;height:1.7em;border:1.5px solid var(--line);border-radius:999px;background:#fff;color:#2f5d8a;cursor:pointer;padding:0}
.mn.on{background:#2f5d8a;border-color:#2f5d8a;color:#fff}
.st.mnn[hidden]{display:none}
.mini{position:fixed;left:0;right:0;top:0;z-index:30;background:var(--ink);transform:translateY(-100%);transition:transform .2s ease;cursor:pointer}
.mini.show{transform:none}
.mini .stripe{display:flex;height:3px}.mini .stripe i{flex:1}
.mini .wrap{display:flex;align-items:center;justify-content:space-between;height:30px}
.mini .mt{font-size:11px;font-weight:600;letter-spacing:.12em;color:var(--yellow)}
.mini .mo{font:inherit;font-size:11px;font-weight:600;background:var(--yellow);color:var(--ink);border:0;border-radius:999px;padding:2px 10px;cursor:pointer}

  phraseWrap(list);
  if(view==='home'){countUp();list.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>goView(b.dataset.go))}
  list.querySelectorAll('.oi').forEach(el=>el.onclick=e=>{e.preventDefault();jumpTopic(+el.dataset.t)});
  const rs=document.getElementById('reshuf');if(rs)rs.onclick=()=>{SH=null;render()};
  list.querySelectorAll('.kseg button').forEach(b=>b.onclick=()=>{sort=b.dataset.k;render();window.scrollTo(0,0)});
  list.querySelectorAll('.oseg button').forEach(b=>b.onclick=()=>{oimg=b.dataset.oi==='1';render();window.scrollTo(0,0)});
  const ob=document.getElementById('omiBtn');if(ob){ob.onclick=drawOmikuji;if(lastOmi)showOmi(lastOmi)}
  list.querySelectorAll('.mbest[data-aid]').forEach(el=>el.onclick=()=>openShot(el.dataset.aid));
  list.querySelectorAll('.mh[data-who]').forEach(el=>el.onclick=()=>{navSave();who=el.dataset.who;aorder='score';q='';document.getElementById('q').value='';view='ogiri';render();window.scrollTo(0,0);navPush()});
  list.querySelectorAll('.zseg button').forEach(b=>b.onclick=()=>{zsort=b.dataset.zs;render();window.scrollTo(0,0)});
  list.querySelectorAll('.dchip[data-t]').forEach(b=>b.onclick=()=>jumpTopic(+b.dataset.t));
  list.querySelectorAll('.mseg button').forEach(b=>b.onclick=()=>{if(b.dataset.ms==='rand'&&msort==='rand')for(const k in MRND)delete MRND[k];msort=b.dataset.ms;render();window.scrollTo(0,0)});
  list.querySelectorAll('.rankseg:not(.kseg):not(.oseg):not(.mseg):not(.zseg) button').forEach(b=>b.onclick=()=>{rmode=b.dataset.r;render();window.scrollTo(0,0)});
  list.querySelectorAll('.more').forEach(b=>b.onclick=()=>{
    const t=D.topics[+b.dataset.t];const ul=b.previousElementSibling;
    const best=Math.max(0,...t.ans.map(SC));let ans=t.ans;if(aorder==='score')ans=ans.map((a,i)=>[a,i]).sort((x,y)=>SC(y[0])-SC(x[0])||x[1]-y[1]).map(x=>x[0]);
    ul.insertAdjacentHTML('beforeend',ans.slice(LIMIT).map(a=>liHTML(a,best,false)).join(''));b.remove();
  });
}
const goHome=()=>{document.getElementById('panel').hidden=true;if(view==='home'){if(PEND)applyNew();else window.scrollTo(0,0);return}goView('home')};

document.getElementById('shot').addEventListener('click',e=>{if(e.target.id==='shot')closeShot()});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeShot()});
function goBack(){if(!document.getElementById('shot').hidden){closeShot();return true}if(history.state&&history.state.d>0){history.back();return true}return false}
window.addEventListener('popstate',e=>{const s=document.getElementById('shot');if(!s.hidden)closeShot(true);const p=e.state;if(!p||!p.view||p.shot)return;view=p.view;sort=p.sort;q=p.q||'';who=p.who;aorder=p.aorder;document.getElementById('q').value=q;document.getElementById('panel').hidden=true;render();window.scrollTo(0,p.y||0)});
let RESTY=0;try{history.scrollRestoration='manual'}catch(e){}
(()=>{let s=history.state;try{const nv=performance.getEntriesByType('navigation')[0];const ss=JSON.parse(sessionStorage.getItem('mp_pos')||'null');if(nv&&nv.type==='reload'&&ss&&ss.view)s=ss}catch(e){}if(s&&s.view&&!s.shot){view=s.view;sort=s.sort||sort;q=s.q||'';who=s.who||null;aorder=s.aorder||aorder;if(s.rmode)rmode=s.rmode;oimg=!!s.oimg;if(s.zsort)zsort=s.zsort;RESTY=s.y||0;document.getElementById('q').value=q}})();
try{history.replaceState({...snap(),y:RESTY,d:(history.state&&history.state.d)||0},'',hurl())}catch(e){}
function savePos(){try{sessionStorage.setItem('mp_pos',JSON.stringify({...snap(),y:window.scrollY}))}catch(e){}}
addEventListener('pagehide',savePos);document.addEventListener('visibilitychange',()=>{if(document.hidden)savePos()});
let _st;addEventListener('scroll',()=>{clearTimeout(_st);_st=setTimeout(()=>{try{const c=history.state||{};if(!c.shot)history.replaceState({...c,...snap(),y:window.scrollY},'')}catch(e){}savePos()},250)},{passive:true});
let tx=null,ty=0;window._moved=false;let _sx=0,_sy=0;document.addEventListener('touchstart',e=>{window._moved=false;_sx=e.touches[0].clientX;_sy=e.touches[0].clientY},{passive:true});document.addEventListener('touchmove',e=>{if(Math.abs(e.touches[0].clientX-_sx)>8||Math.abs(e.touches[0].clientY-_sy)>8)window._moved=true},{passive:true});
document.addEventListener('touchstart',e=>{if(e.touches.length!==1||e.target.closest('.tabrow,.seg,.years,input')){tx=null;return}tx=e.touches[0].clientX;ty=e.touches[0].clientY},{passive:true});
document.addEventListener('touchend',e=>{if(tx===null)return;const t=e.changedTouches[0],dx=t.clientX-tx,dy=t.clientY-ty;tx=null;if(Math.abs(dx)>80&&Math.abs(dx)>Math.abs(dy)*2)goBack()},{passive:true});
(()=>{const mi=document.getElementById('mini'),he=document.getElementById('hero');
  new IntersectionObserver(es=>{const on=!es[0].isIntersecting;mi.classList.toggle('show',on);document.body.classList.toggle('minion',on)}).observe(he);
  mi.addEventListener('click',e=>{if(e.target.closest('#miniOmi'))return;goHome()});
  document.getElementById('miniOmi').onclick=()=>document.getElementById('omiTop').click()})();
document.getElementById('newPill').onclick=applyNew;
addEventListener('scroll',()=>{if(PEND&&view==='home'&&window.scrollY<250&&document.getElementById('shot').hidden){RC=PEND;PEND=null;showNew(0);render()}},{passive:true});
document.getElementById('hero').addEventListener('click',e=>{if(e.target.closest('#omiTop'))return;goHome()});
document.getElementById('omiTop').onclick=()=>{if(view!=='omikuji')goView('omikuji');const b=document.getElementById('omiBtn');if(b&&!lastOmi)drawOmikuji()};
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{if(view!==b.dataset.v)goView(b.dataset.v);else if(view==='home'&&PEND){applyNew();return}window.scrollTo({top:0,behavior:view==='home'?'smooth':'auto'})});
let tm;const qEl=document.getElementById('q');
const qDone=()=>{qEl.value=qEl.value.replace(/[ \u3000]+$/,'');clearTimeout(tm);q=qEl.value.trim();render();qEl.blur()};
qEl.addEventListener('keydown',e=>{if(e.isComposing||e.keyCode===229)return;if(e.key===' '||e.key==='Enter'){e.preventDefault();qDone()}});
qEl.addEventListener('input',e=>{if(!e.isComposing&&/[ \u3000]$/.test(qEl.value)){qDone();return}});
qEl.addEventListener('input',e=>{if(view==='home'){navSave();view='ogiri';navPush()}clearTimeout(tm);tm=setTimeout(()=>{q=e.target.value.trim();render()},200)});
document.querySelectorAll('#sortSeg button').forEach(b=>b.onclick=()=>{sort=b.dataset.s;render()});
document.querySelectorAll('#ansSeg button').forEach(b=>b.onclick=()=>{aorder=b.dataset.a;render()});
const tt=document.getElementById('totop');
addEventListener('scroll',()=>tt.classList.toggle('show',scrollY>600),{passive:true});
tt.onclick=()=>window.scrollTo({top:0,behavior:'smooth'});
render();window._posReady=true;if(RESTY)setTimeout(()=>window.scrollTo(0,RESTY),0);
</script>
</body>
